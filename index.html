<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<!-- Fluid Player -->
<script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* 🔥 FIX PLAYER SIZE */
.video-box{
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
}

video{
  width:100%;
  height:100%;
  object-fit: cover;
  border-radius: 10px;
}

/* INFO */
.title{
  font-size:20px;
  margin-top:10px;
  font-weight:bold;
}

.tags{
  margin-top:8px;
}

.tags span{
  display:inline-block;
  background:#222;
  padding:4px 8px;
  margin-right:5px;
  border-radius:5px;
  font-size:12px;
}

/* ACTORS */
.actors{
  display:flex;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}

.actor{
  display:flex;
  align-items:center;
  gap:6px;
  background:#111;
  padding:5px 8px;
  border-radius:8px;
}

.actor img{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:cover;
}
</style>
</head>

<body>

<div class="container">

  <!-- VIDEO PLAYER -->
  <div class="video-box">
    <video id="my-video" controls>
      <source src="https://cdn22.vids69.com/video/69/2/68125/68125.mp4" type="video/mp4">
    </video>
  </div>

  <!-- TITLE -->
  <div class="title">
    MILF Teacher Jennifer White Takes Her Students
  </div>

  <!-- TAGS -->
  <div class="tags">
    <span>Anal</span>
    <span>BBC</span>
    <span>DP</span>
  </div>

  <!-- ACTORS -->
  <div class="actors">
    <div class="actor">
      <img src="https://i.pinimg.com/736x/88/79/b6/8879b6668a501d8682bbe91b85d3feac.jpg">
      Jennifer White
    </div>

    <div class="actor">
      <img src="https://image.tmdb.org/t/p/w500/95A488ucisVACUwKTljeCJ0bEMH.jpg">
      Damion Dayski
    </div>

    <div class="actor">
      <img src="https://media.themoviedb.org/t/p/w500/6N539DK0cVvmqBk8SuXaMDkrc78.jpg">
      Isiah Maxwell
    </div>
  </div>

</div>

<script>
const VAST_TAG = "https://s.magsrv.com/v1/vast.php?idz=5954624";

/* 🔥 Fluid Player + ExoClick Ads */
fluidPlayer("my-video", {
  layoutControls: {
    primaryColor: "#ff0000",
    posterImage: ""
  },
  vastOptions: {
    adList: [
      {
        roll: "preRoll",
        vastTag: VAST_TAG
      }
    ]
  }
});
</script>

</body>
</html>
