<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Video Player</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial;
}

/* FULL SCREEN WRAPPER */
.container{
  width:100%;
  height:100%;
  position:relative;
  background:#000;
}

/* VIDEO */
video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

/* TITLE OVERLAY */
.title{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  color:#fff;
  font-size:14px;
  z-index:10;
  background:rgba(0,0,0,0.4);
  padding:6px 10px;
  border-radius:8px;
  backdrop-filter: blur(6px);
}

/* fullscreen fix */
:fullscreen video,
:-webkit-full-screen video{
  width:100%;
  height:100%;
  object-fit:contain;
}
</style>
</head>

<body>

<div class="container">

  <div class="title">
    Mina Sauvage
  </div>

  <video id="player" controls playsinline>
    <source src="https://hls-cdn77.xvideos-cdn.com/8I6XfhRG2U8yOP6kL_o4sA==,1781908742/c7a48ec6-e3bb-4d44-a911-b5d1f5b08595/0/hls-1080p-62cef.m3u8" type="video/mp4">
  </video>

</div>

<script>
// 🔥 fullscreen rotate fix
const video = document.getElementById("player");

video.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(()=>{});
    }
  } else {
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }
  }
});
</script>

</body>
</html>
